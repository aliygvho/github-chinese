<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清溪通舟 · 江南活桥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1a12;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .intro-card {
      pointer-events: auto;
      background: rgba(255, 253, 245, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 40px 56px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      max-width: 520px;
      color: #2c3e2c;
      transform: translateY(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .intro-card.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .intro-card h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 2px;
      color: #1a3c1a;
    }
    .intro-card .subtitle {
      font-size: 16px;
      color: #5a6b5a;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .intro-card .btn {
      display: inline-block;
      background: linear-gradient(135deg, #5d8c5d 0%, #3d6b3d 100%);
      color: #fff;
      padding: 14px 42px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      box-shadow: 0 6px 20px rgba(61, 107, 61, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .intro-card .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(61, 107, 61, 0.45);
    }
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .hud.active { opacity: 1; }
    .score-box {
      background: rgba(255, 253, 245, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 12px 22px;
      color: #2c3e2c;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .score-box .label { font-size: 12px; opacity: 0.7; letter-spacing: 1px; }
    .score-box .value { font-size: 26px; font-weight: 700; }
    .controls {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 253, 245, 0.85);
      backdrop-filter: blur(6px);
      color: #3d6b3d;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { transform: scale(1.08); background: #fff; }
    .hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 253, 245, 0.9);
      font-size: 14px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .hint.active { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="hud" id="hud">
    <div class="score-box">
      <div class="label">已通航</div>
      <div class="value" id="scoreValue">0</div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="muteBtn" title="静音">♪</button>
      <button class="icon-btn" id="resetBtn" title="重新开始">↻</button>
    </div>
  </div>

  <div class="hint" id="hint">点击藤蔓节点，疏通航道，让乌篷船缓缓驶过。</div>

  <div class="ui-layer" id="introLayer">
    <div class="intro-card" id="introCard">
      <h1>清溪通舟</h1>
      <div class="subtitle">
        江南的活桥又长疯了。<br>
        藤蔓缠绕、小桥重叠，乌篷船困在 canal 之间。<br>
        做一日护桥小仙，修剪疯长的藤蔓，让水道重新流淌。
      </div>
      <button class="btn" id="startBtn">开始护桥</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const introCard = document.getElementById('introCard');
    const startBtn = document.getElementById('startBtn');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('hint');
    const scoreValue = document.getElementById('scoreValue');
    const resetBtn = document.getElementById('resetBtn');
    const muteBtn = document.getElementById('muteBtn');

    let width, height, dpr;
    let gameStarted = false;
    let score = 0;
    let muted = false;
    let lastTime = 0;

    const bgImage = new Image();
    bgImage.src = 'bg.jpg';

    // Vine system
    const vines = [];
    const particles = [];
    const boats = [];
    const petals = [];
    const lanterns = [];

    class Vine {
      constructor(y, amplitude, thickness) {
        this.y = y;
        this.amplitude = amplitude;
        this.thickness = thickness;
        this.nodes = [];
        this.segments = 7 + Math.floor(Math.random() * 5);
        this.alive = true;
        this.growing = true;
        this.growProgress = 0;
        this.hover = false;
        this.pruned = false;
        this.build();
      }

      build() {
        this.nodes = [];
        const step = width / this.segments;
        for (let i = 0; i <= this.segments; i++) {
          this.nodes.push({
            x: i * step,
            y: this.y + Math.sin(i * 1.2) * this.amplitude + (Math.random() - 0.5) * 40,
            cpX: i * step + step * 0.5,
            cpY: this.y + Math.cos(i * 1.5) * this.amplitude * 1.5,
          });
        }
      }

      update(dt) {
        if (this.growing && this.growProgress < 1) {
          this.growProgress += dt * 0.6;
          if (this.growProgress > 1) this.growProgress = 1;
        }
        // Gentle sway
        const time = performance.now() * 0.001;
        this.nodes.forEach((n, i) => {
          n.y += Math.sin(time + i) * 0.15;
        });
      }

      draw(ctx) {
        if (!this.alive || this.pruned) return;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const maxIndex = Math.floor((this.nodes.length - 1) * this.growProgress);
        const partial = (this.nodes.length - 1) * this.growProgress - maxIndex;

        // Main vine
        ctx.beginPath();
        ctx.moveTo(this.nodes[0].x, this.nodes[0].y);
        for (let i = 0; i < maxIndex; i++) {
          const n0 = this.nodes[i];
          const n1 = this.nodes[i + 1];
          ctx.quadraticCurveTo(n0.cpX, n0.cpY, n1.x, n1.y);
        }
        if (maxIndex < this.nodes.length - 1 && partial > 0) {
          const n0 = this.nodes[maxIndex];
          const n1 = this.nodes[maxIndex + 1];
          const mx = n0.x + (n1.x - n0.x) * partial;
          const my = n0.y + (n1.y - n0.y) * partial;
          const cpx = n0.cpX;
          const cpy = n0.cpY;
          ctx.quadraticCurveTo(cpx, cpy, mx, my);
        }

        ctx.shadowColor = 'rgba(80, 160, 80, 0.45)';
        ctx.shadowBlur = this.hover ? 24 : 14;
        ctx.strokeStyle = this.hover ? '#7db87d' : '#4a7c4a';
        ctx.lineWidth = this.thickness;
        ctx.stroke();

        // Leaves
        const leafCount = Math.floor(maxIndex * 1.5);
        for (let i = 0; i < leafCount; i++) {
          const t = i / leafCount;
          const idx = Math.floor(t * maxIndex);
          if (idx >= this.nodes.length - 1) continue;
          const n0 = this.nodes[idx];
          const n1 = this.nodes[idx + 1];
          const lx = n0.x + (n1.x - n0.x) * 0.5 + Math.sin(i * 3) * 10;
          const ly = n0.y + (n1.y - n0.y) * 0.5 + Math.cos(i * 2.5) * 8;
          this.drawLeaf(ctx, lx, ly, i);
        }

        // Interactive nodes
        this.nodes.forEach((n, i) => {
          if (i % 2 === 0 && i <= maxIndex) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, this.hover ? 7 : 5, 0, Math.PI * 2);
            ctx.fillStyle = this.hover ? '#a8d8a8' : '#6ba86b';
            ctx.shadowColor = 'rgba(120, 200, 120, 0.6)';
            ctx.shadowBlur = 10;
            ctx.fill();
          }
        });

        ctx.restore();
      }

      drawLeaf(ctx, x, y, seed) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(seed * 2.7) * 0.8);
        ctx.scale(0.7 + Math.sin(seed) * 0.2, 0.7 + Math.cos(seed) * 0.2);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${90 + seed * 10}, ${150 + seed * 8}, ${90 + seed * 5}, 0.85)`;
        ctx.fill();
        ctx.restore();
      }

      hitTest(x, y) {
        if (!this.alive || this.pruned || this.growProgress < 0.8) return false;
        for (let i = 0; i < this.nodes.length - 1; i++) {
          const n0 = this.nodes[i];
          const n1 = this.nodes[i + 1];
          const d = pointToSegmentDist(x, y, n0.x, n0.y, n1.x, n1.y);
          if (d < this.thickness + 16) return true;
        }
        return false;
      }

      prune() {
        this.pruned = true;
        // Spawn particles
        for (let i = 0; i < this.nodes.length; i += 2) {
          const n = this.nodes[i];
          for (let j = 0; j < 4; j++) {
            particles.push(new Particle(n.x, n.y, 'leaf'));
          }
        }
      }
    }

    class Boat {
      constructor() {
        this.w = 90;
        this.h = 34;
        this.x = -this.w - Math.random() * 200;
        this.y = height * 0.68 + (Math.random() - 0.5) * 60;
        this.speed = 18 + Math.random() * 12;
        this.state = 'waiting'; // waiting, moving, passed
        this.bob = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.bob += dt * 2;
        const blocked = vines.some(v => v.alive && !v.pruned && v.growProgress > 0.8 && Math.abs(v.y - this.y) < 70);
        if (!blocked) {
          this.x += this.speed * dt;
        }
        if (this.x > width + this.w && this.state !== 'passed') {
          this.state = 'passed';
          score++;
          scoreValue.textContent = score;
          for (let i = 0; i < 8; i++) {
            particles.push(new Particle(this.x - this.w, this.y, 'sparkle'));
          }
        }
      }

      draw(ctx) {
        const y = this.y + Math.sin(this.bob) * 3;
        ctx.save();
        ctx.translate(this.x, y);

        // Hull shadow
        ctx.beginPath();
        ctx.ellipse(0, 14, this.w * 0.55, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fill();

        // Hull
        ctx.beginPath();
        ctx.moveTo(-this.w / 2, -4);
        ctx.quadraticCurveTo(0, 16, this.w / 2, -4);
        ctx.lineTo(this.w / 2 - 6, -10);
        ctx.quadraticCurveTo(0, 6, -this.w / 2 + 6, -10);
        ctx.closePath();
        ctx.fillStyle = '#3d2e22';
        ctx.fill();

        // Canopy
        ctx.beginPath();
        ctx.moveTo(-this.w / 2 + 10, -10);
        ctx.quadraticCurveTo(0, -34, this.w / 2 - 10, -10);
        ctx.closePath();
        ctx.fillStyle = '#6b4c35';
        ctx.fill();

        // Canopy stripes
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1.5;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 14, -10);
          ctx.lineTo(i * 8, -26);
          ctx.stroke();
        }

        // Lantern on boat
        ctx.beginPath();
        ctx.arc(0, -28, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 90, 70, 0.9)';
        ctx.shadowColor = 'rgba(255, 90, 70, 0.8)';
        ctx.shadowBlur = 14;
        ctx.fill();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 80;
        this.vy = (Math.random() - 0.5) * 80;
        this.life = 1;
        this.decay = 0.5 + Math.random() * 0.8;
        this.size = 3 + Math.random() * 5;
        this.angle = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 20 * dt; // gravity
        this.life -= this.decay * dt;
        this.angle += dt * 3;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        if (this.type === 'leaf') {
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#7db87d';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = '#ffdca8';
          ctx.shadowColor = '#ffdca8';
          ctx.shadowBlur = 10;
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class Petal {
      constructor() {
        this.reset();
        this.y = Math.random() * height; // start anywhere
      }

      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.size = 3 + Math.random() * 4;
        this.speed = 18 + Math.random() * 18;
        this.sway = 0.5 + Math.random() * 1.2;
        this.phase = Math.random() * Math.PI * 2;
        this.opacity = 0.4 + Math.random() * 0.4;
      }

      update(dt) {
        this.y += this.speed * dt;
        this.x += Math.sin(performance.now() * 0.001 * this.sway + this.phase) * 15 * dt;
        if (this.y > height + 20) this.reset();
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(performance.now() * 0.001 + this.phase);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ffc4d6';
        ctx.fill();
        ctx.restore();
      }
    }

    class Lantern {
      constructor() {
        this.x = Math.random() * width;
        this.y = height * 0.35 + Math.random() * height * 0.4;
        this.baseY = this.y;
        this.size = 8 + Math.random() * 6;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.y = this.baseY + Math.sin(performance.now() * 0.001 + this.phase) * 10;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ff6b5b';
        ctx.shadowColor = '#ff6b5b';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.restore();
      }
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x1 - x2) ** 2 + (y1 - y2) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (vines.length) vines.forEach(v => v.build());
    }

    function initLevel() {
      vines.length = 0;
      boats.length = 0;
      particles.length = 0;
      petals.length = 0;
      lanterns.length = 0;
      score = 0;
      scoreValue.textContent = '0';

      const canalY = height * 0.68;
      const rows = 4;
      for (let i = 0; i < rows; i++) {
        vines.push(new Vine(
          canalY - 60 + i * 40,
          35 + Math.random() * 25,
          10 + Math.random() * 6
        ));
      }

      for (let i = 0; i < 30; i++) petals.push(new Petal());
      for (let i = 0; i < 12; i++) lanterns.push(new Lantern());
    }

    function spawnBoat() {
      const activeBoats = boats.filter(b => b.state !== 'passed').length;
      const maxBoats = 3;
      if (activeBoats < maxBoats && Math.random() < 0.012) {
        boats.push(new Boat());
      }
    }

    function drawBackground() {
      if (bgImage.complete && bgImage.naturalWidth) {
        const imgAspect = bgImage.naturalWidth / bgImage.naturalHeight;
        const canvasAspect = width / height;
        let drawW, drawH, offX, offY;
        if (canvasAspect > imgAspect) {
          drawW = width;
          drawH = width / imgAspect;
          offX = 0;
          offY = (height - drawH) * 0.5;
        } else {
          drawH = height;
          drawW = height * imgAspect;
          offX = (width - drawW) * 0.5;
          offY = 0;
        }
        ctx.drawImage(bgImage, offX, offY, drawW, drawH);
      } else {
        ctx.fillStyle = '#1a2e1a';
        ctx.fillRect(0, 0, width, height);
      }

      // Soft mist overlay for healing mood
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
      grad.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(1, 'rgba(20, 40, 30, 0.25)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      ctx.clearRect(0, 0, width, height);
      drawBackground();

      if (gameStarted) {
        // Lanterns behind vines
        lanterns.forEach(l => { l.update(dt); l.draw(ctx); });

        // Vines
        vines.forEach(v => { v.update(dt); v.draw(ctx); });

        // Boats
        spawnBoat();
        boats.forEach((b, i) => {
          b.update(dt);
          b.draw(ctx);
          if (b.state === 'passed' && b.x > width + 200) {
            boats.splice(i, 1);
          }
        });

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update(dt);
          p.draw(ctx);
          if (p.life <= 0) particles.splice(i, 1);
        }

        // Petals
        petals.forEach(p => { p.update(dt); p.draw(ctx); });
      }

      requestAnimationFrame(loop);
    }

    // Interaction
    canvas.addEventListener('mousemove', e => {
      if (!gameStarted) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      let cursor = 'crosshair';
      vines.forEach(v => {
        v.hover = !v.pruned && v.hitTest(x, y);
        if (v.hover) cursor = 'pointer';
      });
      canvas.style.cursor = cursor;
    });

    canvas.addEventListener('click', e => {
      if (!gameStarted) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      let hit = false;
      vines.forEach(v => {
        if (!v.pruned && v.hitTest(x, y)) {
          v.prune();
          hit = true;
        }
      });
      if (!hit) {
        // Small ripple/sparkle on water
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(x, y, 'sparkle'));
        }
      }
    });

    startBtn.addEventListener('click', () => {
      introCard.classList.add('hidden');
      hud.classList.add('active');
      hint.classList.add('active');
      gameStarted = true;
      initLevel();
      setTimeout(() => { hint.classList.remove('active'); }, 6000);
    });

    resetBtn.addEventListener('click', () => {
      initLevel();
    });

    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? '✕' : '♪';
    });

    window.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
